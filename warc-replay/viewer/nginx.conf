server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tight CSP for the control page itself.  The replay document runs in
    # an opaque-origin sandbox iframe on another service.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; frame-src http://localhost:8000; connect-src http://localhost:8000; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
    }
}
